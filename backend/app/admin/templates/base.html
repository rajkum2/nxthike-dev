<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NxtHike Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-60 bg-gray-900 text-white flex flex-col fixed h-full">
            <div class="px-5 py-4 border-b border-gray-800">
                <div class="flex items-center gap-2">
                    <div class="h-7 w-7 rounded-md bg-brand-600 flex items-center justify-center">
                        <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <span class="font-bold text-lg">NxtHike</span>
                    <span class="text-xs text-gray-400 ml-1">Admin</span>
                </div>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1">
                <a href="/admin/" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if request.url.path == '/admin/' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/admin/jobs" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if '/admin/jobs' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    Jobs
                </a>
                <a href="/admin/events" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if '/admin/events' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Events
                </a>
                <a href="/admin/courses" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if '/admin/courses' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    Courses
                </a>
                <a href="/admin/companies" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if '/admin/companies' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    Companies
                </a>
                <a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm hover:bg-gray-800 {% if '/admin/users' in request.url.path %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>
                    Users
                </a>
            </nav>
            <div class="px-3 py-4 border-t border-gray-800">
                <a href="/admin/logout" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-gray-400 hover:text-white hover:bg-gray-800">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-60">
            <header class="bg-white border-b border-gray-200 px-6 py-4">
                <h1 class="text-lg font-semibold text-gray-900">{% block header %}Dashboard{% endblock %}</h1>
            </header>
            <div class="p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        function confirmDelete(form) {
            if (confirm('Are you sure you want to delete this item?')) {
                form.submit();
            }
        }
    </script>
</body>
</html>
